   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="35.64" y="38.016" transform="rotate(-0 35.64 38.016)">What changed in Faster-RoboTwin</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #79696b" x="35.64" y="60.192" transform="rotate(-0 35.64 60.192)">Every switch is off by default; with none set, the wrappers run the official code.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="44.712" y="112.7808" transform="rotate(-0 44.712 112.7808)">01</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="74.52" y="112.7808" transform="rotate(-0 74.52 112.7808)">Render only what is read</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 139.387237)">No front camera (read by neither policy</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 152.864581)">nor video); mid-chunk steps render only</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 166.341925)">the head camera, no update_obs</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 209.517633)">EVALOPT_SKIP_UNUSED_CAMS · EVALOPT_LAZY_OBS</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 221.76)">prof_eval.py · opt_loop.py</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="339.552" y="112.7808" transform="rotate(-0 339.552 112.7808)">02</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="369.36" y="112.7808" transform="rotate(-0 369.36 112.7808)">Expert checks recorded once</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 139.387237)">Policy-independent expert-check outcome</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 152.864581)">per seed recorded, then replayed</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 166.341925)">(no cuRobo planning or physics)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 209.517633)">EVALOPT_EXPERT_RECORD / _REPLAY</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 221.76)">expert_cache.py</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="44.712" y="274.3488" transform="rotate(-0 44.712 274.3488)">03</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="74.52" y="274.3488" transform="rotate(-0 74.52 274.3488)">Resident processes</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 300.955237)">One simulator process and one server run</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 314.432581)">many jobs; server reset to key(0) per job;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 327.909925)">cuRobo built only when used</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 371.085633)">prof_eval.py --jobs · EVALOPT_SERVER_NEW_JOB</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 383.328)">EVALOPT_LAZY_CUROBO · prof_server.py</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="339.552" y="274.3488" transform="rotate(-0 339.552 274.3488)">04</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="369.36" y="274.3488" transform="rotate(-0 369.36 274.3488)">Many jobs per GPU</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 300.955237)">One multi-session policy server per GPU:</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 314.432581)">shared weights, per-job observation and</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 327.909925)">random-number chain; 10–14 jobs per GPU</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 371.085633)">EVALOPT_MULTISESSION · EVALOPT_MEM_FRACTION</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 383.328)">multisession_server.py · run_ms_workers.sh</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="44.712" y="435.9168" transform="rotate(-0 44.712 435.9168)">05</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="74.52" y="435.9168" transform="rotate(-0 74.52 435.9168)">Host-side waits and caches</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 462.523237)">CUDA waits block instead of spin</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 476.000581)">(76.9 → 0.8 ms CPU per frame);</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(44.712 489.477925)">SAPIEN render cache kept</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 532.653633)">EVALOPT_CUDA_BLOCKING_SYNC · EVALOPT_KEEP_CACHE</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(44.712 544.896)">cuda_sched.py · prof_eval.py</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8c0000" x="339.552" y="435.9168" transform="rotate(-0 339.552 435.9168)">06</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #292122" x="369.36" y="435.9168" transform="rotate(-0 369.36 435.9168)">Reproducible reference</text>
   </g>
   <g id="text_25">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 462.523237)">XLA autotune results pinned to a file</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 476.000581)">recorded on an idle GPU, so the official</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(339.552 489.477925)">reference repeats bit for bit</text>
   </g>
   <g id="text_26">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 532.653633)">EVALOPT_AUTOTUNE</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(339.552 544.896)">serve_policy.sh · autotune/*.textproto</text>
   </g>
   <g id="text_27">
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(35.64 593.2503)">Optional, not default: EVALOPT_NO_VIDEO + EVALOPT_RECORD_ACTIONS defer the eval video and</text>
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(35.64 606.45555)">replay_video.py rebuilds it. All code is under evalopt/ and scripts/evalopt/; upstream RoboTwin and</text>
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(35.64 619.6608)">XPolicyLab files are unchanged.</text>
   </g>
  </g>
 </g>
